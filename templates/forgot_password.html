<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow | Recuperar Senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="loginContainer">
    <form class="loginCard" method="POST" action="{{ url_for('esqueci_senha') }}" novalidate>
      <h1 class="loginTitulo">Recuperar Senha</h1>
      <p class="loginSubtitulo">Informe seu e-mail para receber o link de recuperação</p>

      <div class="formGroup">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seuemail@exemplo.com"
          required
          autocomplete="email"
        >
      </div>

      {% if mensagem %}
        <div class="form-message {{ 'success' if sucesso else '' }}" role="alert">
          {{ mensagem }}
        </div>
      {% endif %}

      <button type="submit" class="btn-submit">Enviar link</button>

      <p class="signup-link">
        <a href="{{ url_for('login') }}">Voltar ao login</a>
      </p>
    </form>
  </main>
</body>
</html>
