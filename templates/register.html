<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow | Criar Conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="loginContainer">
    <form class="loginCard" method="POST" action="{{ url_for('register') }}" novalidate>
      <h1 class="loginTitulo">CampusFlow</h1>
      <p class="loginSubtitulo">Crie sua conta</p>

      <div class="formGroup">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seuemail@exemplo.com"
          required
        >
      </div>

      <div class="formGroup">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Crie uma senha"
          required
        >
      </div>

      {% if mensagem %}
        <div class="form-message {{ 'success' if sucesso else '' }}" role="alert">
          {{ mensagem }}
        </div>
      {% endif %}

      <button type="submit" class="btn-submit">Cadastrar</button>

      <p class="signup-link">
        Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a>
      </p>
    </form>
  </main>
</body>
</html>
