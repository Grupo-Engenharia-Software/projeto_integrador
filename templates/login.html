<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="loginContainer">
    <form class="loginCard" method="POST" action="{{ url_for('login') }}" novalidate>
      <h1 class="loginTitulo">CampusFlow</h1>
      <p class="loginSubtitulo">Entre com suas credenciais</p>

      <!-- Campo: e-mail -->
      <div class="formGroup">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seuemail@exemplo.com"
          required
          autocomplete="email"
        >
      </div>

      <!-- Campo: senha -->
      <div class="formGroup">
        <label for="password">Senha</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite sua senha"
            required
            autocomplete="current-password"
          >
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar senha">
            👁
          </button>
        </div>
      </div>

      <!-- Mensagem de erro/sucesso: o Flask envia essa variável
           "mensagem" pronta através do render_template().
           Se não houver mensagem, nada aparece na tela. -->
      {% if mensagem %}
        <div class="form-message {{ 'success' if sucesso else '' }}" role="alert">
          {{ mensagem }}
        </div>
      {% endif %}

      <button type="submit" class="btn-submit">Entrar</button>

      <p class="signup-link">
        <a href="{{ url_for('esqueci_senha') }}">Esqueceu a senha?</a>
      </p>

      <p class="signup-link">
        Não tem uma conta? <a href="{{ url_for('register') }}">Cadastre-se</a>
      </p>
    </form>
  </main>

  <script src="{{ url_for('static', filename='js/mostrar_senha.js') }}"></script>
</body>
</html>
