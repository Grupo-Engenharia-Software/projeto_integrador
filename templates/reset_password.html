<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow | Redefinir Senha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="loginContainer">
    {% if token_valido %}
      <form class="loginCard" method="POST" action="{{ url_for('redefinir_senha', token=token) }}" novalidate>
        <h1 class="loginTitulo">Nova Senha</h1>
        <p class="loginSubtitulo">Digite sua nova senha</p>

        <div class="formGroup">
          <label for="password">Nova senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Digite a nova senha"
            required
          >
        </div>

        <div class="formGroup">
          <label for="confirmar_senha">Confirmar nova senha</label>
          <input
            type="password"
            id="confirmar_senha"
            name="confirmar_senha"
            placeholder="Repita a nova senha"
            required
          >
        </div>

        {% if mensagem %}
          <div class="form-message {{ 'success' if sucesso else '' }}" role="alert">
            {{ mensagem }}
          </div>
        {% endif %}

        <button type="submit" class="btn-submit">Redefinir senha</button>
      </form>
    {% else %}
      <div class="loginCard" style="aspect-ratio: unset;">
        <h1 class="loginTitulo">Link inválido</h1>
        <p class="loginSubtitulo">{{ mensagem }}</p>
        <a href="{{ url_for('esqueci_senha') }}" class="btn-submit" style="display: block; text-align: center; text-decoration: none;">
          Solicitar novo link
        </a>
      </div>
    {% endif %}
  </main>
</body>
</html>
