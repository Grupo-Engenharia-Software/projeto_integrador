version: "3.9"

# Sobe apenas o banco de dados PostgreSQL usado pela aplicação.
# A aplicação Flask roda localmente (fora do container) apontando para
# localhost:5432, conforme configurado no .env.example.
services:
  db:
    image: postgres:16
    container_name: projeto_integrador_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projeto_integrador
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
